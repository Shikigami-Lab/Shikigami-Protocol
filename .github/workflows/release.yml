name: CD Release

on:
  push:
    tags:
      - 'v*' # 当推送形如 v1.0.0 的 tag 时触发
  workflow_dispatch: # 允许手动从 Actions 页面触发，方便调试

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Release Draft
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    # 对于跨平台打包，分别在不同系统上运行
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write # 给 electron-builder 自动发布 Release 的权限

    steps:
    - name: Free Disk Space (Ubuntu)
      if: runner.os == 'Linux'
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Python binary
      shell: bash
      run: |
        # Use PyInstaller to compile server.py into a standalone executable.
        if [ "$RUNNER_OS" = "Windows" ]; then
          SEP=";"
        else
          SEP=":"
        fi
        
        # We collect all core libraries and handle dynamic imports.
        # This ensures the backend starts even on machines with NO python installed.
        pyinstaller --onefile server.py \
          --collect-all uvicorn \
          --collect-all fastapi \
          --collect-all starlette \
          --collect-all pydantic \
          --collect-all edge_tts \
          --collect-all httpx \
          --collect-all jinja2 \
          --collect-all anyio \
          --collect-all sniffio \
          --collect-all click \
          --collect-all websockets \
          --collect-all yaml \
          --collect-all ruamel \
          --collect-all dotenv \
          --collect-all openai \
          --collect-all pydantic_core \
          --hidden-import uvicorn.logging \
          --hidden-import uvicorn.loops.auto \
          --hidden-import uvicorn.protocols.http.auto \
          --hidden-import uvicorn.protocols.websockets.auto \
          --hidden-import uvicorn.lifespan.on \
          --add-data "package.json${SEP}."
        
        # Move the binary to the root for electron-builder to pick it up.
        if [ "$RUNNER_OS" = "Windows" ]; then
          mv dist/server.exe ./server.exe
        else
          mv dist/server ./server
        fi

    - name: Bundle Python embeddable + pip (Windows only)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        # Download Python 3.10 embeddable package (same version as CI Python)
        curl -L "https://www.python.org/ftp/python/3.10.11/python-3.10.11-embed-amd64.zip" -o python_embed.zip
        unzip -q python_embed.zip -d python_embed
        # Enable site-packages so pip-installed packages are importable
        sed -i 's/#import site/import site/' python_embed/python310._pth
        # Bootstrap pip into the embeddable Python
        curl -L "https://bootstrap.pypa.io/get-pip.py" -o get-pip.py
        python_embed/python.exe get-pip.py --quiet

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: 'npm'

    - name: Install Node dependencies
      shell: bash
      run: npm install

    - name: Build Electron App
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        npm run build -- --publish always
