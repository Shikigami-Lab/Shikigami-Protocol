name: Docker Build Test

on:
  push:
    branches: [ "main", "master", "dev" ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - 'requirements-ai.txt'
      - '.dockerignore'
      - 'package.json'
      - 'config/**'
      - 'static/**'
      - '.github/workflows/docker-test.yml'
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
      - 'src/**'
      - 'server.py'
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch: # 允许手动触发
  workflow_call:

permissions:
  contents: read

jobs:
  docker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false # 只测试构建，不推送到镜像仓库
        load: true
        tags: shikigami-protocol:test

    - name: Run Docker Container (Smoke Test)
      run: python .github/scripts/docker_smoke.py --image shikigami-protocol:test --timeout 90
