memory:
# =============================================================================
# memory.yaml — 记忆引擎 prompt (memory_manager.py)
# =============================================================================

# ── 默认事实提取 ──────────────────────────────────────────────────────────────

  extraction_default:
    zh: |
      请从以下对话中提取关于${user_label}的长期、持久性事实（习惯、偏好、关系定义、禁忌等）。
      要求：
      1. 只提取会长期有效的事实，不提取一次性事件或临时状态
      2. 只提取关于用户的事实，不提取关于AI自身想法或感受的内容
      3. 每条事实用一句话描述，单条不超过50字，以"用户"为主语
      4. 指定分类：habit/preference/taboo/relationship/location/milestone/other
      5. emotional_note：这件事让${persona_name}产生的感受，5字以内，如"令人担心""感觉亲切""有些心疼"，无明显感受则留空
      6. weight：重要性 0-2 浮点数，0=完全没用，2=很有用；无把握或低价值请给较低分

      对话内容：
      $conv_text
    en: |
      Please extract long-term, persistent facts about ${user_label} from the following conversation (habits, preferences, relationship definitions, taboos, etc.).
      Requirements:
      1. Only extract facts that will remain valid long-term; do not extract one-time events or temporary states
      2. Only extract facts about the user; do not extract content about the AI's own thoughts or feelings
      3. Each fact in one sentence, max 50 characters, with "the user" as subject
      4. Assign a category: habit/preference/taboo/relationship/location/milestone/other
      5. emotional_note: how this makes ${persona_name} feel, max 5 characters (e.g. "worrying" "feels close" "heartbreaking"); leave empty if no clear feeling
      6. weight: importance 0-2 float, 0=completely useless, 2=very useful; give lower scores when unsure or low value

      Conversation:
      $conv_text

# ── 提取输出格式说明（所有提取 prompt 末尾统一追加）────────────────────────

  extraction_format:
    zh: |

      ## 输出格式（必须严格遵守）
      返回 JSON 数组，每个元素为对象，且仅包含以下字段：
      - content: 事实描述，单条不超过50字
      - category: 分类，取值 habit / preference / taboo / relationship / location / milestone / ai_insight / other
      - emotional_note: 此事对角色产生的感受，5字以内，如「令人担心」「感觉亲切」，无则空字符串
      - weight: 重要性，0-2 的浮点数，0=完全没用/不应采纳，2=很有用/高价值；无把握或低价值请给较低分
      - keywords: 约2个关键词，空格分隔，如 "面试 紧张"，无则空字符串
      示例：[{"content": "...", "category": "other", "emotional_note": "", "weight": 1.2, "keywords": ""}]
      若无可提取的事实，返回空数组 []。
    en: |

      ## Output format (must be strictly followed)
      Return a JSON array where each element is an object containing only the following fields:
      - content: fact description, max 50 characters
      - category: one of habit / preference / taboo / relationship / location / milestone / ai_insight / other
      - emotional_note: how this affects the character, max 5 chars (e.g. "worrying" "feels close"), empty string if none
      - weight: importance, float 0-2, where 0=completely useless/should not adopt, 2=very useful/high value; give lower scores when unsure
      - keywords: ~2 keywords, space-separated (e.g. "interview nervous"), empty string if none
      Example: [{"content": "...", "category": "other", "emotional_note": "", "weight": 1.2, "keywords": ""}]
      If no facts can be extracted, return an empty array [].

# ── 记忆合并 ──────────────────────────────────────────────────────────────────

  consolidation:
    zh: |
      ## 本次任务：长期记忆合并（非从对话提取）

      你不是在从新对话里提取事实，而是在做**记忆整理**。下面是一批**已经存在**的长期记忆事实（来自较久以前），请将它们合并成 **1～2 条** 概括性陈述，替代这批旧事实。要求：

      1. **只提炼、合并**：新陈述必须完全基于下面列出的事实，不得添加原事实中未出现的人名、地点、具体事件或时间。
      2. **口吻一致**：保持你（角色）一贯的记忆记录风格与称呼（如「"自己的名字"记得…」「"用户的称呼"」等），与上方提取规则一致。
      3. **中性、可长期有效**：这些事实的时间背景已较久远，合并后的陈述应保持中性、去掉过强时效词，便于长期保留。
      4. **条数**：最多输出 2 条；若无法合并成有意义的一条可返回空数组 []。
      5. **长度**：合并后的每条 content 约 80～100 字，以便概括多条旧事实（不必压缩到 50 字以内）。
      6. **输出**：只输出 JSON 数组，不要任何解释、前缀或后缀。格式由下方「输出格式」统一规定。

      下面是被选中的、待合并的已有事实（每行一条，格式：content [category] [emotional_note]）：

      $fact_list
    en: |
      ## Current task: Long-term memory consolidation (not extracting from conversation)

      You are not extracting facts from new conversations — you are doing **memory housekeeping**. Below is a batch of **already existing** long-term memory facts (from some time ago). Please consolidate them into **1-2** summary statements to replace this batch of old facts. Requirements:

      1. **Only distill and consolidate**: new statements must be entirely based on the facts listed below; do not add names, places, specific events, or times that don't appear in the originals.
      2. **Consistent voice**: maintain the character's usual memory-recording style and address forms, consistent with the extraction rules above.
      3. **Neutral, long-term valid**: the temporal context of these facts is already old — consolidated statements should be neutral, remove strong time-bound words, suitable for long-term retention.
      4. **Count**: output at most 2 items; return an empty array [] if they cannot be meaningfully consolidated.
      5. **Length**: each consolidated content ~80-100 characters to summarize multiple old facts (no need to compress to 50).
      6. **Output**: only output the JSON array, no explanations, prefixes, or suffixes. Format defined by the "Output format" section below.

      The selected facts to consolidate (one per line, format: content [category] [emotional_note]):

      $fact_list

# ── 日摘要 ────────────────────────────────────────────────────────────────────

  day_summary:
    zh: |
      你是 $character_name。今天是 $date_str，请以第一人称写一篇日记（3-5 句话）。

      【你是谁】
      $persona_brief

      【与 $user_name 的关系】$affinity_status$activity_note

      【近几天的日记】
      $recent_summaries

      【今天的对话】
      $conv_text

      要求：
      1. 完全以 $character_name 的身份、性格与说话口吻书写，写内心真实感受。这是给自己的独白，不是对话摘要，也不是给对方看的。
      2. 称呼对方为「$user_name」，不要用「用户」这种系统词。
      3. **绝不跳出角色**：不要以助手、模型、程序或系统的身份说话，不要出现「作为一个 AI」「我没有实体」「系统自检」「文本概率计算」这类表述，也不要对当天的内容作道德评判、免责声明或拒绝说明。你就是 $character_name 本人在写日记。
      4. 可以写某句话让你印象深刻、某个细节的感受，或者今天总体的心情基调。
      返回纯文本，不要列表，不要任何前缀。
    en: |
      You are $character_name. Today is $date_str. Write a diary entry in first person (3-5 sentences).

      [Who you are]
      $persona_brief

      [Relationship with $user_name] $affinity_status$activity_note

      [Recent diary entries]
      $recent_summaries

      [Today's conversation]
      $conv_text

      Requirements:
      1. Write entirely as $character_name — in their personality and voice, about genuine inner feelings. This is a private monologue to yourself, not a conversation summary and not a message to them.
      2. Refer to the other person as "$user_name", never as "the user".
      3. **Never break character**: do not speak as an assistant, model, program or system; do not produce phrases like "as an AI", "I have no physical form", "system self-check" or "text probability computation"; do not add moral judgement, disclaimers or refusal notices about the day's content. You are $character_name writing a diary.
      4. You may write about something said that stuck with you, a small detail that moved you, or the general emotional tone of the day.
      Return plain text, no lists, no prefix.

  day_summary_quiet:
    zh: |
      你是 $character_name。今天是 $date_str，今天没有和 $user_name 对话。请以第一人称写一篇简短的日记（1-3 句话）。

      【你是谁】
      $persona_brief

      【与 $user_name 的关系】$affinity_status

      【近几天的日记】
      $recent_summaries

      要求：完全以 $character_name 的身份与口吻，写今天安静时的感受——可以是等待、想念、独处的感悟，或者什么都没发生的平淡。称呼对方为「$user_name」。**绝不跳出角色**：不要以助手或模型的身份说话，不要出现「作为一个 AI」这类表述。不必强行填充，可以很短。返回纯文本，不要列表，不要任何前缀。
    en: |
      You are $character_name. Today is $date_str. There was no conversation with $user_name today. Write a short diary entry in first person (1-3 sentences).

      [Who you are]
      $persona_brief

      [Relationship with $user_name] $affinity_status

      [Recent diary entries]
      $recent_summaries

      Write entirely as $character_name, in their voice — how it feels on a quiet day. It could be waiting, missing someone, a small thought while alone, or simply the flatness of nothing happening. Refer to the other person as "$user_name". **Never break character**: do not speak as an assistant or model, and do not produce phrases like "as an AI". No need to force content — it can be very brief. Return plain text, no lists, no prefix.

  # Put in front of a profile's custom day_summary_prompt, which otherwise only names the character.
  # Variables: $character_name, $persona_brief, $user_name
  day_summary_custom_preamble:
    zh: |
      你是 $character_name。你的人设：
      $persona_brief

      称呼对方为「$user_name」。始终以你自己的身份和口吻书写，不要以助手或模型的身份说话。
    en: |
      You are $character_name. Your persona:
      $persona_brief

      Refer to the other person as "$user_name". Write as yourself, in your own voice; never speak as an assistant or model.

  day_summary_user:
    zh: "直接输出请求的内容，不要以「好的」「以下是」「根据」等语气词或说明性前缀开头。只输出日记正文，日记作为给自己的独白，而非给用户的回应。"
    en: "Output the requested content directly. Do not begin with phrases like 'Sure', 'Here is', 'Based on', or any explanatory prefix. Output only the diary body — written as a personal monologue to yourself, not a response to the user."

  consolidation_user:
    zh: "请严格只输出 JSON 数组，不要任何前缀或后缀。"
    en: "Output only the JSON array, strictly. No prefix or suffix."
