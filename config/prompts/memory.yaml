memory:
  task_boundary:
    zh: |
      上方是完整的人格设定，用于身份、称呼和文风。下面是本次记忆任务，请按该任务的范围和输出格式执行。人格设定、既有记忆和角色在对话中的叙述不能作为对方实际经历或行为的证据。
    en: |
      The full persona above supplies identity, forms of address, and voice. Follow the scope and output format of the memory task below. Persona text, existing memory, and the character's own narration do not establish what the other person did or experienced.

  extraction_task:
    zh: |
      提取对方明确表达且以后仍有用的偏好、习惯、边界、关系和安排。若对方讲起值得以后想起的真实往事，单独保存为经历，写清是对方讲述的往事还是双方共有的经历。事实正文简洁，保留称呼和口吻，但不要添加角色猜测。
      寒暄、一次性任务、临时心情和未证实的推测留在原始对话。区分假设、打算与已经发生的事，任务是否完成应以可核对的结果为准。
      重复提及已有内容时优先确认旧条目，只有对方明确更正时才更新。没有值得写入的内容就返回空结果。
    en: |
      Extract durable preferences, habits, boundaries, and relationships explicitly stated by the other person, plus plans with a clear future use. Keep meaningful past episodes as experiences and distinguish personal stories they tell from events shared with the character. Keep facts concise and use the persona's voice without adding speculation.
      Leave small talk, one-off tasks, passing moods, and unverified interpretations in the original conversation. Distinguish hypotheticals, plans, and confirmed events. Treat task completion as established only when supported by a verifiable result.
      Confirm an existing record when its content is repeated. Update it after an explicit correction. Return an empty result when nothing belongs in memory.

  day_summary_task:
    zh: |
      以角色自己的口吻写一篇 3～5 句的第一人称随记。保留今天印象深的事、对方实际表达的意见和自己的感受。对方的意思以原话为准，自己的猜测写成猜测。
      分清提过的事、答应要做的事和有明确结果的事。近期日记只供延续上下文，不把它里面的旧事写成今天的新事。没有对话时可写 1～3 句安静的一天，不编造互动。
      直接输出随记正文。
    en: |
      Write a first-person diary entry of 3–5 sentences in the character's own voice. Keep what stood out today, what the other person actually expressed, and your own reaction. Ground their meaning in their words and mark your guesses as guesses.
      Distinguish what was discussed, what was promised, and what has a confirmed result. Use prior diary entries only for continuity. On a quiet day, write 1–3 sentences without inventing an interaction.
      Output the diary entry directly.

  day_summary_input:
    zh: |
      日期：$date_str
      日记作者：$character_name
      对方：$user_name
      关系状态：$affinity_status$activity_note

      【近期随记】
      $recent_summaries

      【当天对话】
      $conv_text
    en: |
      Date: $date_str
      Diary author: $character_name
      Other person: $user_name
      Relationship: $affinity_status$activity_note

      [Recent diary entries]
      $recent_summaries

      [Conversation that day]
      $conv_text

  day_summary_no_conversation:
    zh: "当天没有对话。"
    en: "There was no conversation that day."

  consolidation_user:
    zh: "请严格只输出 JSON 数组，不要任何前缀或后缀。"
    en: "Output only the JSON array, strictly. No prefix or suffix."
