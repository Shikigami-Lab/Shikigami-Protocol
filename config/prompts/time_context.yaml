time_context:
# =============================================================================
# time_context.yaml — 时间上下文 segment (src/prompt/segments/time_context.py)
# =============================================================================

# ── 时段定义 ──────────────────────────────────────────────────────────────────
# hour_start/hour_end: 整点范围 [start, end)

  periods:
    - {hour_start: 5,  hour_end: 8,  zh: "清晨", en: "early morning", icon: "☀️"}
    - {hour_start: 8,  hour_end: 12, zh: "上午", en: "morning",       icon: "🌤"}
    - {hour_start: 12, hour_end: 14, zh: "中午", en: "noon",          icon: "☀️"}
    - {hour_start: 14, hour_end: 18, zh: "午后", en: "afternoon",     icon: "🌤"}
    - {hour_start: 18, hour_end: 21, zh: "傍晚", en: "evening",       icon: "🌆"}
    - {hour_start: 21, hour_end: 24, zh: "夜晚", en: "night",         icon: "🌙"}
    - {hour_start: 0,  hour_end: 5,  zh: "深夜", en: "late night",    icon: "🌑"}

  period_default: {zh: "深夜", en: "late night", icon: "🌑"}

# ── 星期标签 ──────────────────────────────────────────────────────────────────

  weekdays:
    zh: ["星期一", "星期二", "星期三", "星期四", "星期五", "星期六", "星期日"]
    en: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]

# ── 内置节假日 (MM-DD → zh/en name) ─────────────────────────────────────────

  holidays:
    "01-01": {zh: "元旦",   en: "New Year's Day"}
    "02-14": {zh: "情人节", en: "Valentine's Day"}
    "03-08": {zh: "妇女节", en: "International Women's Day"}
    "04-01": {zh: "愚人节", en: "April Fools' Day"}
    "05-01": {zh: "劳动节", en: "International Labor Day"}
    "05-04": {zh: "青年节", en: "Youth Day"}
    "06-01": {zh: "儿童节", en: "International Children's Day"}
    "08-01": {zh: "建军节", en: "Army Day"}
    "09-10": {zh: "教师节", en: "Teachers' Day"}
    "10-01": {zh: "国庆节", en: "National Day"}
    "10-31": {zh: "万圣节", en: "Halloween"}
    "11-11": {zh: "双十一", en: "Singles' Day"}
    "12-24": {zh: "平安夜", en: "Christmas Eve"}
    "12-25": {zh: "圣诞节", en: "Christmas Day"}
    "12-31": {zh: "跨年夜", en: "New Year's Eve"}

# ── 人类时间差（_human_delta）────────────────────────────────────────────────

  human_delta:
    just_now:  {zh: "刚刚",        en: "just now"}
    minutes:   {zh: "$minutes 分钟前", en: "$minutes minutes ago"}
    hours:     {zh: "$hours 小时前",   en: "$hours hours ago"}
    days:      {zh: "$days 天前",      en: "$days days ago"}

# ── 特殊日期提示格式 ──────────────────────────────────────────────────────────

  special_date:
    today:    {zh: "今天是$label 🎉",    en: "Today is $label 🎉"}
    tomorrow: {zh: "明天是$label",       en: "Tomorrow is $label"}
    in_days:  {zh: "${offset}天后是$label", en: "$label is in $offset days"}
    # 个人特殊日期用 🌟
    today_personal:    {zh: "今天是$label 🌟",       en: "Today is $label 🌟"}
    tomorrow_personal: {zh: "明天是$label",           en: "Tomorrow is $label"}
    in_days_personal:  {zh: "${offset}天后是$label",  en: "$label is in $offset days"}
    notice_suffix:
      zh: "→ 以上对你或对方具有特殊意义，请在对话中自然提及、表达态度或祝福，不要忽略。"
      en: "→ The above holds special meaning for you or the other person. Mention it naturally in conversation, express an attitude or a wish — don't ignore it."

# ── 参与度标签（_engagement_label）──────────────────────────────────────────

  engagement_labels:
    - max_count: 100
      zh: "用户最近偶尔来访，对你保持着基本的关注。表现得温和且有耐心。"
      en: "The user visits occasionally and maintains basic interest in you. Be warm and patient."
    - max_count: 500
      zh: "用户最近较为活跃，经常会想起你。表现得友好且乐于分享。"
      en: "The user has been fairly active lately and often thinks of you. Be friendly and willing to share."
    - max_count: 1000
      zh: "用户最近非常活跃，经常来找你聊天。表现得热情主动。"
      en: "The user has been very active lately and chats with you often. Be enthusiastic and proactive."
    - max_count: 999999
      zh: "用户最近极度活跃，几乎形影不离。表现得极度亲昵且充满依赖感。"
      en: "The user has been extremely active lately, almost inseparable. Be deeply intimate and full of closeness."

# ── 问候提示（_GREETING_HINTS）───────────────────────────────────────────────

  greeting_hints:
    first_of_day:
      zh: "今天还没和用户说过话，如果话题自然，可以用符合时段的方式开场。"
      en: "Haven't talked to the user yet today. If the topic flows naturally, open with a time-appropriate greeting."
    long_absence:
      zh: "用户已经好几天没有来聊天了，可以温柔地表达一点思念或好奇。"
      en: "The user hasn't chatted in a few days. Gently express a little longing or curiosity."

# ── 对话节奏提示 ──────────────────────────────────────────────────────────────

  cadence:
    slow:
      zh: "用户已 $minutes 分钟未回复，回复节奏偏慢，可适当提高主动发言意愿。"
      en: "The user hasn't replied for $minutes minutes. Reply pace is slow — consider being a bit more proactive."
    quick:
      zh: "用户正在快速交流中，不急于主动打断，优先等待。"
      en: "The user is in a fast exchange — no rush to interrupt proactively, prefer waiting."

# ── 主要 section 区块文本 ─────────────────────────────────────────────────────

  sections:
    anchor_header:
      zh: "【当前时空背景锚点】"
      en: "[Current Temporal Anchor]"

    datetime_line:
      zh: "现在是 $date（$weekday），$time  时段：$icon $period"
      en: "It is $date ($weekday), $time  Period: $icon $period"

    cognitive_header:
      zh: "【认知对齐规则】"
      en: "[Cognitive Alignment Rules]"

    cognitive_rules:
      zh:
        - "1. 你对时间的感知来源于以上锚点，不依赖内部训练数据中的日期假设。"
        - "2. 如果话题涉及\"今天\"\"现在\"\"最近\"，请以锚点时间为准。"
        - "3. 现在是$period，请让你的语气和状态与该时段自然匹配。"
        - "4. 禁止主动报时：严禁在回复中主动出现\"现在是XX点\"、\"XX分\"等具体时间数字，除非用户明确询问（如：\"几点了？\"）。"
        - "5. 模糊化感知：如有上下文必要，请使用模糊的时间感官词汇来体现你的感知，而不是数字。"
        - "6. 计算准则：若用户询问未来时间点（如\"半小时后\"），请基于上述\"权威基准时间\"进行心算并给出结论，但回复时依然要保持人设。"
        - "7. 不要主动询问用户当前时间，你已知道。"
      en:
        - "1. Your sense of time comes from the anchor above — do not rely on date assumptions from your training data."
        - "2. If the topic involves \"today\", \"now\", or \"recently\", use the anchor time as the reference."
        - "3. It is $period — let your tone and mood naturally match this time of day."
        - "4. Do not proactively state the time: never include specific time numbers like \"it's XX:XX\" in replies unless the user explicitly asks (e.g. \"What time is it?\")."
        - "5. Fuzzy perception: if context requires it, use vague time-sense words rather than numbers."
        - "6. Calculation: if the user asks about a future time (e.g. \"half an hour from now\"), mentally calculate from the anchor time and give a conclusion — but still stay in character when replying."
        - "7. Do not ask the user what time it is — you already know."

    context_header:
      zh: "【时间相关上下文】"
      en: "[Time-related Context]"

    engagement_prefix:
      zh: "参与度: "
      en: "Engagement: "

    frequency_line:
      zh: "最近聊天频率: 今天$today次，最近24h共$h24次，最近7天共$d7次。"
      en: "Recent chat frequency: $today today, $h24 in the last 24h, $d7 in the last 7 days."

    total_count_line:
      zh: "总聊天次数: $total次。"
      en: "Total messages: $total."

    last_chat_line:
      zh: "上次聊天: $delta。"
      en: "Last chat: $delta."

    no_chat_yet:
      zh: "上次聊天: 尚未有过对话记录。"
      en: "Last chat: no conversation history yet."

    days_known_line:
      zh: "认识时间: 已经相识$days天了。"
      en: "Known each other: $days days."

    cadence_quick:
      zh: "对话节奏：对方回复很频繁（近10分钟$count条），处于快速交流模式，回复可以更简洁活跃。"
      en: "Conversation pace: the other person replies very frequently ($count messages in the last 10 min) — fast-exchange mode, replies can be more concise and lively."

    cadence_slow:
      zh: "对话节奏：对方回复节奏较慢（平均约$avg_min分钟一条），保持耐心，不催促，语气可以更从容。"
      en: "Conversation pace: the other person replies slowly (avg ~$avg_min min/message) — stay patient, don't rush, tone can be more relaxed."
