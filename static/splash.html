<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shikigami Protocol</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: transparent;
      color: #eae8ff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 48px;
      background: rgba(13, 13, 26, 0.88);
      border: none;
      border-radius: 50%;
      box-shadow:
        inset 0 0 0 1px rgba(124,108,240,0.35),
        inset 0 0 36px rgba(124,108,240,0.08),
        0 0 0 1px rgba(0,0,0,0.05),
        0 0 60px rgba(0,0,0,0.25);
      transform: scale(0.88);
      animation: seal-in 0.5s ease-out, breathe 2.8s ease-in-out 0.5s infinite;
    }
    @keyframes seal-in {
      from { opacity: 0; transform: scale(0.82); }
      to   { opacity: 1; transform: scale(0.88); }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(0.88); box-shadow: inset 0 0 0 1px rgba(124,108,240,0.3), inset 0 0 36px rgba(124,108,240,0.06), 0 0 0 1px rgba(0,0,0,0.04), 0 0 50px rgba(0,0,0,0.2); }
      50%      { transform: scale(0.9); box-shadow: inset 0 0 0 1px rgba(124,108,240,0.5), inset 0 0 44px rgba(124,108,240,0.12), 0 0 0 1px rgba(0,0,0,0.06), 0 0 70px rgba(0,0,0,0.3); }
    }
    .logo {
      font-size: 52px; font-weight: normal; letter-spacing: 2px; margin-bottom: 6px;
      font-family: KaiTi, "STKaiti", "Kaiti SC", "楷体", serif;
      text-shadow: 0 0 18px rgba(124,108,240,0.25);
      animation: logo-glow 2.8s ease-in-out 0.5s infinite;
    }
    @keyframes logo-glow {
      0%, 100% { text-shadow: 0 0 18px rgba(124,108,240,0.2); opacity: 0.95; }
      50%      { text-shadow: 0 0 28px rgba(124,108,240,0.4); opacity: 1; }
    }
    .title { font-size: 12px; color: #8880b8; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 20px; }
    .progress-wrap {
      width: 180px;
      height: 4px;
      background: rgba(124,108,240,0.15);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, rgba(124,108,240,0.6), rgba(160,150,255,0.9));
      border-radius: 2px;
      transition: width 0.25s ease-out;
    }
    .status {
      font-size: 11px; color: #8880b8; margin-top: 10px; min-height: 1.4em;
      text-align: center; max-width: 180px; line-height: 1.4;
      animation: pulse 1.3s ease-in-out infinite;
    }
    .status-sub {
      font-size: 10px; color: #5a5480; margin-top: 4px;
      text-align: center; min-height: 1.2em;
    }
    @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">式</div>
    <div class="title">Shikigami Protocol</div>
    <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
    <div class="status" id="statusText">Starting...</div>
    <div class="status-sub" id="statusSub"></div>
  </div>
  <script>
    /* Step definitions — must match main.js / server.py progress calls */
    var STEPS = [
      { pct: 10,  label: 'Load configuration' },
      { pct: 20,  label: 'Release port' },
      { pct: 30,  label: 'Wait for service' },
      { pct: 40,  label: 'Initialize session' },
      { pct: 50,  label: 'Initialize engines' },
      { pct: 60,  label: 'Register tools & timers' },
      { pct: 70,  label: 'Start reflection & proactive speech' },
      { pct: 85,  label: 'Start daily memory tasks' },
      { pct: 100, label: 'Done' },
    ];

    var totalSteps = STEPS.length;

    window.__setSplashProgress = function(pct, msg) {
      var fill = document.getElementById('progressFill');
      var txt  = document.getElementById('statusText');
      var sub  = document.getElementById('statusSub');

      if (fill) fill.style.width = (Math.min(100, Math.max(0, pct))) + '%';
      if (txt)  txt.textContent = msg || ('Starting... ' + Math.round(pct) + '%');

      /* Count done steps and find current step label */
      var doneCount = 0;
      var currentLabel = '';
      for (var i = 0; i < STEPS.length; i++) {
        var prevPct = i === 0 ? 0 : STEPS[i - 1].pct;
        if (pct >= STEPS[i].pct) {
          doneCount++;
        } else if (pct >= prevPct && !currentLabel) {
          currentLabel = STEPS[i].label;
        }
      }

      if (sub) {
        if (pct >= 100) {
          sub.textContent = 'All ' + totalSteps + ' modules are ready';
        } else if (doneCount > 0) {
          sub.textContent = 'Completed ' + doneCount + ' / ' + totalSteps + ' modules';
        } else {
          sub.textContent = '';
        }
      }
    };
  </script>
</body>
</html>
